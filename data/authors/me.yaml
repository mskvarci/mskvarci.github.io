bio: |
  I'm a homeschooled junior pursuing an Associate in Engineering through dual
  enrollment at Wake Tech Community College — self-directing a rigorous STEM
  curriculum that's earned straight A's through Calculus III and Physics II.
  That same initiative led me to seek out research opportunities: I now
  contribute CAD design work for the SSailOR rover project at NC State,
  working alongside PhD researchers on wind tunnel-validated prototypes for
  planetary exploration.

  On FRC Team 6500 (GearCats), I serve as CAD Lead, translating team design
  concepts into fabrication-ready models using SolidWorks, Fusion 360,
  3D printers, and multi-axis CNC routers.

  I'm seeking a Summer 2026 engineering internship where I can bring the same
  self-driven work ethic to real-world problems in mechanical, aerospace, or
  robotics engineering.

