name: Deploy site & generate PDF resume

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.162.1"
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: hugo --minify --baseURL "https://mskvarci.github.io/"

      - name: Generate PDF resume
        run: |
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          CHROME=$(which chromium-browser || which chromium)
          $CHROME --headless --disable-gpu --no-sandbox \
            --run-all-compositor-stages-before-draw \
            --print-to-pdf=public/uploads/resume.pdf \
            --no-pdf-header-footer \
            file://${{ github.workspace }}/public/resume/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
